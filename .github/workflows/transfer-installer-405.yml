name: Transfer verified installer 2.7.0.405
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Transfer immutable ordinary EXE to existing draft
        env:
          PACKAGE_URL: ${{ secrets.FRESH_INSTALLER_TRANSFER_405_20261125 }}
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import hashlib, json, os, pathlib, subprocess, urllib.request, zipfile
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'installer-405-transfer'
          root.mkdir(exist_ok=False)
          archive=root/'complete.zip'
          try:
              with urllib.request.urlopen(os.environ['PACKAGE_URL'], timeout=90) as response, archive.open('wb') as output:
                  while chunk:=response.read(4<<20):output.write(chunk)
          except Exception:
              raise RuntimeError('Artifact transfer failed; private signed URL suppressed.') from None
          def sha(p):
              with p.open('rb') as stream:return hashlib.file_digest(stream,'sha256').hexdigest()
          assert archive.stat().st_size==1398652063
          assert sha(archive)=='82399aa4f87355a3136f4410c52a817974d6b8866e84c9686880ba28dd9e4854'
          exe=root/'Acceess-Control-Tracking-Setup.exe'
          with zipfile.ZipFile(archive) as z:
              members=[m for m in z.infolist() if m.filename=='installer/FreshUSA-AccessControl-Setup.exe']
              assert len(members)==1 and members[0].file_size==1392867460
              with z.open(members[0]) as source, exe.open('wb') as dest:
                  while chunk:=source.read(4<<20):dest.write(chunk)
          expected='86fb1ffdb16b22dd4abce49697749b7053470991e751ac453ba928a3f39369cd'
          assert sha(exe)==expected and exe.stat().st_size==1392867460
          repo=os.environ['GITHUB_REPOSITORY']
          def api(path,method='GET'):
              data=subprocess.check_output(['gh','api',path,'--method',method,'--header','Cache-Control: no-cache'])
              return json.loads(data) if data.strip() else None
          matches=[r for r in api('repos/'+repo+'/releases') if r['tag_name']=='v2.7.0.405']
          assert len(matches)==1 and matches[0]['draft']
          release=matches[0]
          existing=[a for a in release['assets'] if a['name']==exe.name]
          assert len(existing)<=1
          if existing and existing[0]['state']=='starter' and existing[0]['size']==0:
              api('repos/'+repo+'/releases/assets/'+str(existing[0]['id']),'DELETE')
              existing=[]
          if existing:
              assert existing[0]['state']=='uploaded' and existing[0]['size']==exe.stat().st_size and existing[0]['digest']=='sha256:'+expected
          else:
              subprocess.run(['gh','release','upload','v2.7.0.405',str(exe),'--repo',repo],check=True)
          release=api('repos/'+repo+'/releases/'+str(release['id']))
          assert release['draft'], 'Transfer must not publish the release.'
          asset=next(a for a in release['assets'] if a['name']==exe.name)
          assert asset['state']=='uploaded' and asset['size']==1392867460 and asset['digest']=='sha256:'+expected
          proof={'status':'PASSED','runId':os.environ['GITHUB_RUN_ID'],'destinationRepository':repo,'releaseTag':'v2.7.0.405','draftPreserved':True,'artifactArchiveSha256':'82399aa4f87355a3136f4410c52a817974d6b8866e84c9686880ba28dd9e4854','bytes':asset['size'],'sha256':expected,'assetId':asset['id'],'onlyExactOrdinaryExeTransferred':True,'broadSourceCredentialProvidedToRunner':False}
          (pathlib.Path(os.environ['GITHUB_WORKSPACE'])/'transfer-proof.json').write_text(json.dumps(proof,indent=2)+'\n')
          print(json.dumps(proof))
      - name: Preserve transfer proof
        uses: actions/upload-artifact@v4
        with:
          name: transfer-proof-405
          path: transfer-proof.json
          retention-days: 7
